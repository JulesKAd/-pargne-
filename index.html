<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulateur d'Épargne Avancé</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Icons (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background-color: #f3f4f6;
            color: #1f2937;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        /* Smooth transitions */
        .post-card { transition: all 0.3s ease; }
        .post-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        
        <!-- Header -->
        <header class="mb-8 text-center md:text-left flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold text-gray-900 flex items-center gap-3">
                    <i class="fa-solid fa-piggy-bank text-brand-600"></i>
                    Simulateur d'Épargne
                </h1>
                <p class="text-gray-500 mt-1">Planifiez et visualisez votre stratégie patrimoniale.</p>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="forceRefresh()" class="bg-white border border-gray-200 text-gray-600 hover:text-brand-600 hover:border-brand-300 hover:bg-brand-50 px-4 py-3 rounded-2xl shadow-sm transition-all flex items-center gap-2" title="Forcer le recalcul">
                    <i class="fa-solid fa-rotate"></i>
                </button>
                <div class="bg-white px-6 py-3 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                    <div class="text-sm text-gray-500">Capital estimé à terme</div>
                    <div id="summary-total-capital" class="text-2xl font-bold text-brand-600">0 €</div>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Left Column : Inputs -->
            <div class="lg:col-span-5 space-y-6">
                
                <!-- Section 1 : Paramètres généraux -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-gray-400"></i> Paramètres Généraux
                    </h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Salaire Net Mensuel</label>
                            <div class="relative">
                                <input type="number" id="net-salary" value="3000" min="0" step="100" class="w-full pl-4 pr-10 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
                                <span class="absolute right-4 top-2.5 text-gray-400 font-medium">€</span>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Horizon de projection</label>
                            <div class="relative">
                                <input type="number" id="projection-years" value="10" min="1" max="50" step="1" class="w-full pl-4 pr-16 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
                                <span class="absolute right-4 top-2.5 text-gray-400 font-medium">Ans</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Section 2 : Poches d'épargne -->
                <div class="flex items-center justify-between mt-8 mb-4">
                    <h2 class="text-lg font-semibold flex items-center gap-2">
                        <i class="fa-solid fa-wallet text-gray-400"></i> Vos Épargnes
                    </h2>
                    <button onclick="addPost()" class="text-sm bg-brand-50 text-brand-600 hover:bg-brand-100 px-4 py-2 rounded-lg font-medium transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> Ajouter
                    </button>
                </div>

                <div id="posts-container" class="space-y-4">
                    <!-- Les poches d'épargne seront injectées ici par JS -->
                </div>
                
                <!-- Section 3 : Sorties et Projets -->
                <div class="flex items-center justify-between mt-8 mb-4">
                    <h2 class="text-lg font-semibold flex items-center gap-2">
                        <i class="fa-solid fa-money-bill-transfer text-gray-400"></i> Sorties & Projets
                    </h2>
                    <button onclick="addExpense()" class="text-sm bg-orange-50 text-orange-600 hover:bg-orange-100 px-4 py-2 rounded-lg font-medium transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> Ajouter
                    </button>
                </div>

                <div id="expenses-container" class="space-y-4">
                    <!-- Les sorties seront injectées ici par JS -->
                </div>
                
                <!-- Résumé des contributions -->
                <div class="bg-gray-800 text-white p-5 rounded-2xl shadow-lg mt-6 grid grid-cols-3 gap-4 text-center divide-x divide-gray-700">
                    <div>
                        <div class="text-gray-400 text-xs mb-1">Épargne</div>
                        <div id="summary-monthly-savings" class="text-lg font-bold text-emerald-400">0 €</div>
                    </div>
                    <div>
                        <div class="text-gray-400 text-xs mb-1">Sorties</div>
                        <div id="summary-monthly-expenses" class="text-lg font-bold text-orange-400">0 €</div>
                    </div>
                    <div>
                        <div class="text-gray-400 text-xs mb-1">Reste à vivre</div>
                        <div id="summary-monthly-rest" class="text-lg font-bold text-brand-400">0 €</div>
                    </div>
                </div>

            </div>

            <!-- Right Column : Visualisations -->
            <div class="lg:col-span-7 space-y-6">
                
                <!-- Graphique : Évolution dans le temps -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col h-[400px]">
                    <h2 class="text-lg font-semibold mb-4">Évolution du Capital</h2>
                    <div class="flex-grow relative w-full h-full">
                        <canvas id="lineChart"></canvas>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Graphique : Répartition mensuelle -->
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center">
                        <h2 class="text-lg font-semibold w-full text-left mb-4">Répartition Mensuelle</h2>
                        <div class="relative w-full aspect-square max-w-[250px]">
                            <canvas id="pieChart"></canvas>
                        </div>
                    </div>

                    <!-- Informations supplémentaires -->
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-center gap-4">
                        <div class="p-4 bg-emerald-50 rounded-xl border border-emerald-100">
                            <div class="text-sm text-emerald-600 font-medium mb-1"><i class="fa-solid fa-arrow-trend-up mr-2"></i>Intérêts générés</div>
                            <div id="summary-interests" class="text-2xl font-bold text-emerald-700">0 €</div>
                        </div>
                        <div class="p-4 bg-blue-50 rounded-xl border border-blue-100">
                            <div class="text-sm text-blue-600 font-medium mb-1"><i class="fa-solid fa-piggy-bank mr-2"></i>Capital versé</div>
                            <div id="summary-invested" class="text-2xl font-bold text-blue-700">0 €</div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Palette de couleurs pour les graphiques
        const chartColors = [
            '#3b82f6', // blue-500
            '#10b981', // emerald-500
            '#f59e0b', // amber-500
            '#ef4444', // red-500
            '#8b5cf6', // violet-500
            '#06b6d4', // cyan-500
            '#ec4899', // pink-500
            '#f97316'  // orange-500
        ];

        // État de l'application
        let state = {
            salary: 3000,
            horizonYears: 10,
            posts: [],
            expenses: []
        };

        let nextPostId = 1;
        let nextExpenseId = 1;

        // Instances Chart.js
        let pieChartInstance = null;
        let lineChartInstance = null;

        // Formateur de monnaie
        const currencyFormatter = new Intl.NumberFormat('fr-FR', {
            style: 'currency',
            currency: 'EUR',
            maximumFractionDigits: 0
        });

        // Initialisation au chargement
        document.addEventListener('DOMContentLoaded', () => {
            
            // Initialiser les graphiques en premier pour éviter les erreurs de référence
            initCharts();
            
            // Ajouter des données par défaut
            addPost({
                title: "Livret A",
                type: "percent",
                value: 10,
                yield: 3,
                durationMode: "infinite",
                durationMonths: 12
            });
            
            addPost({
                title: "PEA (ETF)",
                type: "fixed",
                value: 300,
                yield: 7,
                durationMode: "infinite",
                durationMonths: 120
            });
            
            // Ajouter des sorties par défaut
            addExpense({
                title: "Remboursement Crédit",
                type: "fixed",
                value: 800
            });
            
            addExpense({
                title: "Loisirs / Vacances",
                type: "percent",
                value: 10
            });

            // Écouteurs globaux
            document.getElementById('net-salary').addEventListener('input', handleGlobalInput);
            document.getElementById('projection-years').addEventListener('input', handleGlobalInput);
            
            // Premier calcul
            updateSimulation();
        });

        function handleGlobalInput() {
            state.salary = parseFloat(document.getElementById('net-salary').value) || 0;
            state.horizonYears = parseInt(document.getElementById('projection-years').value) || 1;
            updateSimulation();
        }

        // Forcer le rafraîchissement avec animation
        function forceRefresh() {
            const icon = document.querySelector('.fa-rotate');
            icon.classList.add('animate-spin');
            setTimeout(() => icon.classList.remove('animate-spin'), 500);
            updateSimulation();
        }

        // Ajouter une nouvelle poche d'épargne
        function addPost(defaultData = null) {
            const id = nextPostId++;
            const post = defaultData || {
                title: `Épargne ${id}`,
                type: 'fixed',
                value: 100,
                yield: 4,
                durationMode: 'infinite',
                durationMonths: 24
            };
            post.id = id;
            state.posts.push(post);
            renderPosts();
            updateSimulation();
        }

        // Supprimer une poche
        function removePost(id) {
            state.posts = state.posts.filter(p => p.id !== id);
            renderPosts();
            updateSimulation();
        }

        // Mettre à jour une poche depuis le DOM
        function updatePost(id, field, value) {
            const post = state.posts.find(p => p.id === id);
            if (post) {
                post[field] = value;
                
                // Gérer le toggle de durée via l'interface (radio buttons)
                if (field === 'durationMode') {
                    renderPosts(); // Re-render to show/hide the months input
                }
                updateSimulation();
            }
        }

        // Rendu des poches d'épargne dans le DOM
        function renderPosts() {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';

            state.posts.forEach((post, index) => {
                const color = chartColors[index % chartColors.length];
                
                const div = document.createElement('div');
                div.className = 'post-card bg-white p-5 rounded-xl border border-gray-100 shadow-sm relative overflow-hidden';
                div.innerHTML = `
                    <div class="absolute top-0 left-0 w-1 h-full" style="background-color: ${color}"></div>
                    
                    <div class="flex justify-between items-start mb-4">
                        <input type="text" value="${post.title}" onchange="updatePost(${post.id}, 'title', this.value)" class="font-semibold text-gray-800 bg-transparent border-b border-transparent hover:border-gray-300 focus:border-brand-500 focus:outline-none transition-colors px-1 py-0.5 w-1/2">
                        <button onclick="removePost(${post.id})" class="text-gray-400 hover:text-red-500 transition-colors" title="Supprimer">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <!-- Apport mensuel -->
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">Apport mensuel</label>
                            <div class="flex">
                                <select onchange="updatePost(${post.id}, 'type', this.value)" class="bg-gray-50 border border-gray-200 text-sm rounded-l-lg p-2 focus:outline-none focus:border-brand-500 w-16">
                                    <option value="fixed" ${post.type === 'fixed' ? 'selected' : ''}>€</option>
                                    <option value="percent" ${post.type === 'percent' ? 'selected' : ''}>%</option>
                                </select>
                                <input type="number" min="0" step="any" value="${post.value}" oninput="updatePost(${post.id}, 'value', parseFloat(this.value) || 0)" class="w-full bg-gray-50 border-y border-r border-gray-200 rounded-r-lg p-2 text-sm focus:outline-none focus:border-brand-500">
                            </div>
                        </div>

                        <!-- Rendement -->
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">Rendement annuel</label>
                            <div class="relative">
                                <input type="number" min="0" max="100" step="0.1" value="${post.yield}" oninput="updatePost(${post.id}, 'yield', parseFloat(this.value) || 0)" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2 pr-8 text-sm focus:outline-none focus:border-brand-500">
                                <span class="absolute right-3 top-2 text-gray-400 text-sm">%</span>
                            </div>
                        </div>
                    </div>

                    <!-- Durée -->
                    <div class="bg-gray-50 p-3 rounded-lg border border-gray-100">
                        <label class="block text-xs font-medium text-gray-500 mb-2">Durée de l'apport</label>
                        <div class="flex items-center gap-4">
                            <label class="flex items-center gap-2 text-sm cursor-pointer">
                                <input type="radio" name="duration-${post.id}" value="infinite" ${post.durationMode === 'infinite' ? 'checked' : ''} onchange="updatePost(${post.id}, 'durationMode', 'infinite')" class="text-brand-600 focus:ring-brand-500">
                                Infinie
                            </label>
                            <label class="flex items-center gap-2 text-sm cursor-pointer">
                                <input type="radio" name="duration-${post.id}" value="fixed" ${post.durationMode === 'fixed' ? 'checked' : ''} onchange="updatePost(${post.id}, 'durationMode', 'fixed')" class="text-brand-600 focus:ring-brand-500">
                                Limitée
                            </label>
                        </div>
                        
                        ${post.durationMode === 'fixed' ? `
                            <div class="mt-3 flex items-center gap-2 animate-[fadeIn_0.2s_ease-out]">
                                <input type="number" min="1" value="${post.durationMonths}" oninput="updatePost(${post.id}, 'durationMonths', parseInt(this.value) || 0)" class="w-24 bg-white border border-gray-200 rounded-md p-1.5 text-sm focus:outline-none focus:border-brand-500">
                                <span class="text-sm text-gray-600">mois</span>
                            </div>
                        ` : ''}
                    </div>
                    
                    <!-- Affichage du montant calculé si pourcentage -->
                    ${post.type === 'percent' ? `
                        <div class="mt-3 text-right text-xs text-gray-500 font-medium">
                            Soit <span class="text-brand-600">${currencyFormatter.format((post.value / 100) * state.salary)}</span> / mois
                        </div>
                    ` : ''}
                </div>
                `;
                container.appendChild(div);
            });
        }

        // --- GESTION DES SORTIES / PROJETS ---

        function addExpense(defaultData = null) {
            const id = nextExpenseId++;
            const expense = defaultData || {
                title: `Dépense ${id}`,
                type: 'fixed',
                value: 150
            };
            expense.id = id;
            state.expenses.push(expense);
            renderExpenses();
            updateSimulation();
        }

        function removeExpense(id) {
            state.expenses = state.expenses.filter(e => e.id !== id);
            renderExpenses();
            updateSimulation();
        }

        function updateExpense(id, field, value) {
            const expense = state.expenses.find(e => e.id === id);
            if (expense) {
                expense[field] = value;
                updateSimulation();
            }
        }

        function renderExpenses() {
            const container = document.getElementById('expenses-container');
            container.innerHTML = '';

            state.expenses.forEach((expense) => {
                const div = document.createElement('div');
                div.className = 'post-card bg-white p-4 rounded-xl border border-gray-100 shadow-sm relative overflow-hidden flex flex-col gap-3';
                div.innerHTML = `
                    <div class="absolute top-0 left-0 w-1 h-full bg-orange-400"></div>
                    
                    <div class="flex justify-between items-center ml-2">
                        <input type="text" value="${expense.title}" onchange="updateExpense(${expense.id}, 'title', this.value)" class="font-semibold text-gray-800 bg-transparent border-b border-transparent hover:border-gray-300 focus:border-brand-500 focus:outline-none transition-colors px-1 py-0.5 w-2/3">
                        <button onclick="removeExpense(${expense.id})" class="text-gray-400 hover:text-red-500 transition-colors p-2" title="Supprimer">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>

                    <div class="flex gap-2 items-center ml-2">
                        <select onchange="updateExpense(${expense.id}, 'type', this.value)" class="bg-gray-50 border border-gray-200 text-sm rounded-lg p-2 focus:outline-none focus:border-brand-500 w-16">
                            <option value="fixed" ${expense.type === 'fixed' ? 'selected' : ''}>€</option>
                            <option value="percent" ${expense.type === 'percent' ? 'selected' : ''}>%</option>
                        </select>
                        <input type="number" min="0" step="any" value="${expense.value}" oninput="updateExpense(${expense.id}, 'value', parseFloat(this.value) || 0)" class="flex-grow bg-gray-50 border border-gray-200 rounded-lg p-2 text-sm focus:outline-none focus:border-brand-500">
                    </div>
                    
                    ${expense.type === 'percent' ? `
                        <div class="text-right text-xs text-gray-500 font-medium">
                            Soit <span class="text-orange-600 expense-calc-val">${currencyFormatter.format((expense.value / 100) * state.salary)}</span> / mois
                        </div>
                    ` : ''}
                `;
                container.appendChild(div);
            });
        }

        // Moteur de calcul principal
        function updateSimulation() {
            // Lecture inputs globaux pour sécurité
            const salary = state.salary;
            const horizonMonths = state.horizonYears * 12;

            let totalMonthlySavings = 0;
            let totalMonthlyExpenses = 0;
            let totalInvestedFinal = 0;
            
            // Calcul des sorties (expenses)
            state.expenses.forEach(expense => {
                if (expense.type === 'percent') {
                    totalMonthlyExpenses += (expense.value / 100) * salary;
                } else {
                    totalMonthlyExpenses += expense.value;
                }
            });
            
            // Préparer les données pour les graphiques
            const pieLabels = [];
            const pieData = [];
            const pieColors = [];
            
            // Pour la courbe
            const lineLabels = [];
            for (let m = 0; m <= horizonMonths; m += 12) {
                lineLabels.push(`Année ${m/12}`);
            }

            const lineDatasets = [];
            let totalCapitalOverTime = new Array(lineLabels.length).fill(0);

            // Calcul par poste
            state.posts.forEach((post, index) => {
                const color = chartColors[index % chartColors.length];
                
                // Montant mensuel
                let monthlyContrib = 0;
                if (post.type === 'percent') {
                    monthlyContrib = (post.value / 100) * salary;
                } else {
                    monthlyContrib = post.value;
                }

                // Pour le camembert (répartition au mois 1)
                if (monthlyContrib > 0) {
                    pieLabels.push(post.title);
                    pieData.push(monthlyContrib);
                    pieColors.push(color);
                }
                
                // Taux mensuel (Intérêts composés)
                const monthlyRate = post.yield / 100 / 12;

                // Simulation sur l'horizon
                let currentBalance = 0;
                let postCapitalOverTime = [];
                let postTotalInvested = 0;

                for (let m = 0; m <= horizonMonths; m++) {
                    // Enregistrer le solde tous les 12 mois
                    if (m % 12 === 0) {
                        postCapitalOverTime.push(currentBalance);
                        totalCapitalOverTime[m/12] += currentBalance;
                    }

                    // Ajouter la contribution et les intérêts pour le mois suivant
                    if (m < horizonMonths) {
                        let isContributing = post.durationMode === 'infinite' || m < post.durationMonths;
                        let contrib = isContributing ? monthlyContrib : 0;
                        
                        currentBalance = currentBalance * (1 + monthlyRate) + contrib;
                        postTotalInvested += contrib;
                    }
                }

                totalInvestedFinal += postTotalInvested;
                totalMonthlySavings += monthlyContrib;

                // Dataset pour la courbe
                lineDatasets.push({
                    label: post.title,
                    data: postCapitalOverTime,
                    borderColor: color,
                    backgroundColor: color,
                    borderWidth: 2,
                    tension: 0.4,
                    pointRadius: 0,
                    pointHitRadius: 10,
                    fill: false
                });
            });

            // Dataset du capital total
            lineDatasets.unshift({
                label: 'Capital Total',
                data: totalCapitalOverTime,
                borderColor: '#1f2937', // dark gray
                backgroundColor: 'rgba(31, 41, 55, 0.1)',
                borderWidth: 3,
                tension: 0.4,
                pointRadius: 2,
                fill: true,
                borderDash: [5, 5]
            });

            // Mise à jour des widgets Textuels
            const finalCapital = totalCapitalOverTime[totalCapitalOverTime.length - 1] || 0;
            const finalInterests = finalCapital - totalInvestedFinal;
            const restToLive = salary - totalMonthlySavings - totalMonthlyExpenses;
            
            document.getElementById('summary-total-capital').innerText = currencyFormatter.format(finalCapital);
            document.getElementById('summary-monthly-savings').innerText = currencyFormatter.format(totalMonthlySavings);
            document.getElementById('summary-monthly-expenses').innerText = currencyFormatter.format(totalMonthlyExpenses);
            document.getElementById('summary-monthly-rest').innerText = currencyFormatter.format(restToLive);
            
            // Colorer le reste à vivre en rouge si négatif
            const restElement = document.getElementById('summary-monthly-rest');
            if(restToLive < 0) {
                restElement.classList.replace('text-brand-400', 'text-red-400');
            } else {
                restElement.classList.replace('text-red-400', 'text-brand-400');
            }
            
            document.getElementById('summary-invested').innerText = currencyFormatter.format(totalInvestedFinal);
            document.getElementById('summary-interests').innerText = currencyFormatter.format(finalInterests > 0 ? finalInterests : 0);

            // Mise à jour des graphiques
            updateCharts(pieLabels, pieData, pieColors, lineLabels, lineDatasets);
            
            // Mise à jour des sous-totaux dans le DOM (si les % changent à cause du salaire)
            if(state.posts.some(p => p.type === 'percent')){
                 const container = document.getElementById('posts-container');
                 const spans = container.querySelectorAll('.text-brand-600');
                 let percentIndex = 0;
                 state.posts.forEach(p => {
                     if(p.type === 'percent' && spans[percentIndex]) {
                         spans[percentIndex].innerText = currencyFormatter.format((p.value/100)*salary);
                         percentIndex++;
                     }
                 });
            }
            
            // Idem pour les dépenses
            if(state.expenses.some(e => e.type === 'percent')){
                 const container = document.getElementById('expenses-container');
                 const spans = container.querySelectorAll('.expense-calc-val');
                 let percentIndex = 0;
                 state.expenses.forEach(e => {
                     if(e.type === 'percent' && spans[percentIndex]) {
                         spans[percentIndex].innerText = currencyFormatter.format((e.value/100)*salary);
                         percentIndex++;
                     }
                 });
            }
        }

        function initCharts() {
            // Configuration par défaut Chart.js
            Chart.defaults.font.family = 'Inter, sans-serif';
            Chart.defaults.color = '#6b7280';
            Chart.defaults.plugins.tooltip.padding = 12;
            Chart.defaults.plugins.tooltip.backgroundColor = 'rgba(17, 24, 39, 0.9)';

            // Pie Chart
            const ctxPie = document.getElementById('pieChart').getContext('2d');
            pieChartInstance = new Chart(ctxPie, {
                type: 'doughnut',
                data: {
                    labels: [],
                    datasets: [{ data: [], backgroundColor: [], borderWidth: 0 }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '70%',
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let value = context.raw || 0;
                                    return ' ' + currencyFormatter.format(value) + ' / mois';
                                }
                            }
                        }
                    }
                }
            });

            // Line Chart
            const ctxLine = document.getElementById('lineChart').getContext('2d');
            lineChartInstance = new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: []
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { usePointStyle: true, boxWidth: 8 }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return ' ' + context.dataset.label + ': ' + currencyFormatter.format(context.raw);
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: '#f3f4f6' },
                            ticks: {
                                callback: function(value) {
                                    return new Intl.NumberFormat('fr-FR', { notation: "compact", compactDisplay: "short" }).format(value) + '€';
                                }
                            }
                        },
                        x: {
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        function updateCharts(pieLabels, pieData, pieColors, lineLabels, lineDatasets) {
            // Update Pie
            if (pieData.length === 0) {
                pieChartInstance.data.labels = ['Aucune épargne'];
                pieChartInstance.data.datasets[0].data = [1];
                pieChartInstance.data.datasets[0].backgroundColor = ['#e5e7eb'];
            } else {
                pieChartInstance.data.labels = pieLabels;
                pieChartInstance.data.datasets[0].data = pieData;
                pieChartInstance.data.datasets[0].backgroundColor = pieColors;
            }
            pieChartInstance.update();

            // Update Line
            lineChartInstance.data.labels = lineLabels;
            lineChartInstance.data.datasets = lineDatasets;
            lineChartInstance.update();
        }

    </script>
</body>
</html>
